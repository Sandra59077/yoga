name: Sync Notion -> videos.json

on:
  schedule:
    - cron: '0 * * * *'      # jede volle Stunde
  workflow_dispatch:          # Knopf "Run workflow" fuer sofortige Aktualisierung
  push:
    branches: [ main ]
    paths:
      - 'scripts/sync-notion.mjs'
      - '.github/workflows/sync-notion.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: videos.json aus Notion erzeugen
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/sync-notion.mjs

      - name: Aenderungen committen (falls vorhanden)
        run: |
          if [ -n "$(git status --porcelain videos.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add videos.json
            git commit -m "videos.json aus Notion aktualisiert"
            git push
          else
            echo "Keine Aenderungen an videos.json."
          fi
