<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bewegung">
<title>Yoga · Fitness · Meditation</title>
<style>
  :root{
    --bg1:#1b2a4a; --bg2:#22344f; --accent:#9bc7b5; --accent2:#e7b7a3;
    --card:rgba(255,255,255,.08); --card-br:rgba(255,255,255,.16);
    --text:#f4f1ea; --muted:#b9c2cf;
    --yoga:#9bc7b5; --fitness:#e7a17a; --med:#b7a6e0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2) 60%,#2c3e2f);
    color:var(--text);min-height:100%;
    display:flex;flex-direction:column;align-items:center;
    padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));
  }
  .wrap{width:100%;max-width:460px;margin:auto;}
  h1{font-size:1.4rem;font-weight:600;text-align:center;margin:.2em 0 .1em;}
  .sub{text-align:center;color:var(--muted);font-size:.92rem;margin-bottom:1.4em;}
  .screen{display:none;}
  .screen.active{display:block;animation:fade .3s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  /* Art selection */
  .arts{display:flex;flex-direction:column;gap:14px;margin-top:10px;}
  .art{
    display:flex;align-items:center;gap:16px;padding:20px;border-radius:20px;
    border:1.5px solid var(--card-br);background:var(--card);cursor:pointer;transition:.15s;
  }
  .art:active{transform:scale(.98);}
  .art .ic{font-size:2rem;width:52px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:14px;flex:none;}
  .art .tx{flex:1;}
  .art .tx b{font-size:1.15rem;display:block;}
  .art .tx span{color:var(--muted);font-size:.85rem;}
  .art.yoga .ic{background:rgba(155,199,181,.22);}
  .art.fitness .ic{background:rgba(231,161,122,.22);}
  .art.med .ic{background:rgba(183,166,224,.22);}
  .art .arrow{color:var(--muted);font-size:1.3rem;}

  .back{background:none;border:none;color:var(--muted);font-size:.95rem;cursor:pointer;padding:6px 0;margin-bottom:6px;}
  .pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;font-size:.9rem;font-weight:600;margin-bottom:16px;}
  .pill.yoga{background:rgba(155,199,181,.22);color:var(--yoga);}
  .pill.fitness{background:rgba(231,161,122,.22);color:var(--fitness);}
  .pill.med{background:rgba(183,166,224,.22);color:var(--med);}

  .label{font-size:.9rem;color:var(--muted);margin:0 0 .6em;}
  .chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;}
  .chip{
    flex:1 1 28%;min-width:0;text-align:center;
    padding:14px 6px;border-radius:16px;border:1.5px solid var(--card-br);
    background:var(--card);color:var(--text);font-size:1rem;font-weight:600;
    cursor:pointer;transition:.15s;user-select:none;
  }
  .chip.active{background:var(--accent);color:#15241f;border-color:var(--accent);}
  .custom{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
  .custom input{
    flex:1;background:var(--card);border:1.5px solid var(--card-br);color:var(--text);
    font-size:1.05rem;padding:14px 16px;border-radius:16px;width:100%;
  }
  .custom span{color:var(--muted);font-size:.95rem;}
  .go{
    width:100%;padding:18px;border:none;border-radius:18px;
    background:linear-gradient(135deg,var(--accent),#7fae9b);color:#10201b;
    font-size:1.18rem;font-weight:700;cursor:pointer;transition:.15s;
    box-shadow:0 6px 20px rgba(0,0,0,.25);
  }
  .go:active{transform:scale(.98);}
  .note{color:var(--muted);font-size:.82rem;margin:-8px 0 18px;line-height:1.5;}
  .result{
    margin-top:22px;background:var(--card);border:1.5px solid var(--card-br);
    border-radius:20px;padding:20px;display:none;
  }
  .result.show{display:block;animation:fade .3s ease;}
  .result .meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .badge{font-size:.78rem;padding:4px 10px;border-radius:999px;background:rgba(155,199,181,.22);color:var(--accent);font-weight:600;}
  .badge.ch{background:rgba(231,183,163,.18);color:var(--accent2);}
  .result h2{font-size:1.12rem;line-height:1.35;margin:.1em 0 .9em;font-weight:600;}
  .open{
    display:block;width:100%;text-align:center;text-decoration:none;
    padding:16px;border-radius:16px;background:#ff3b30;color:#fff;
    font-size:1.08rem;font-weight:700;
  }
  .open:active{opacity:.85;}
  .again{margin-top:12px;width:100%;padding:13px;border-radius:14px;border:1.5px solid var(--card-br);background:transparent;color:var(--text);font-size:.98rem;cursor:pointer;}
  .progress{text-align:center;color:var(--muted);font-size:.86rem;margin-top:18px;line-height:1.5;}
  .progress b{color:var(--accent);}
  .reset{margin-top:8px;background:none;border:none;color:var(--muted);font-size:.82rem;text-decoration:underline;cursor:pointer;display:block;margin-left:auto;margin-right:auto;}
  .toast{
    position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);
    background:#2c3e2f;color:#fff;padding:12px 20px;border-radius:14px;font-size:.9rem;
    opacity:0;transition:.3s;pointer-events:none;border:1px solid var(--card-br);max-width:90%;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .err{color:var(--accent2);text-align:center;font-size:.9rem;margin-top:14px;min-height:1em;}
</style>
</head>

        <div class="arrow">›</div>

    <span class="pill" id="pill"></span>

    <div id="timeBlock">

      <div class="chips" id="chips"></div>
      <div class="label">…oder eigene Zeit eingeben</div>
      <div class="custom">
        <input id="customTime" type="number" inputmode="numeric" min="1" placeholder="z. B. 22" aria-label="Minuten">

      </div>
    </div>
    <div class="note" id="medNote" style="display:none;">
      Für Meditationen sind noch keine Zeiten hinterlegt – es wird zufällig aus allen ausgewählt.
    </div>

    <button class="go" id="goBtn">Video auswählen&nbsp;🎲</button>
    <div class="err" id="err"></div>

    <div class="result" id="result">
      <div class="meta">
        <span class="badge" id="rDur"></span>
        <span class="badge ch" id="rChan"></span>
      </div>
      <h2 id="rTitle"></h2>
      <a class="open" id="rOpen" href="#" target="_blank" rel="noopener">▶︎ In YouTube öffnen</a>
      <button class="again" id="againBtn">🎲 Anderes Video</button>
    </div>

    <div class="progress" id="progress"></div>
    <button class="reset" id="resetBtn">Verlauf dieser Kategorie zurücksetzen</button>
  </div>
</div>
<div class="toast" id="toast"></div>

const QUICK = [15,20,25,30,45,60];
const ART_META = {
  Yoga:{icon:"🧘🏻",cls:"yoga"},
  Fitness:{icon:"💪",cls:"fitness"},
  Meditation:{icon:"🕉️",cls:"med"}
};

let currentArt = null;
let selectedTime = null;
let lastPick = null;

// ---- persistence (Verlauf pro Art getrennt) ----
function keyFor(art){ return "watched_"+art+"_v2"; }
function getWatched(art){
  try{ return JSON.parse(localStorage.getItem(keyFor(art))) || []; }catch(e){ return []; }
}
function setWatched(art,arr){
  try{ localStorage.setItem(keyFor(art), JSON.stringify(arr)); }catch(e){}
}

// ---- element refs ----
const screenArt = document.getElementById('screenArt');
const screenTime = document.getElementById('screenTime');
const subtitle = document.getElementById('subtitle');
const pill = document.getElementById('pill');
const chipsEl = document.getElementById('chips');
const customEl = document.getElementById('customTime');
const timeBlock = document.getElementById('timeBlock');
const medNote = document.getElementById('medNote');

// ---- build quick chips ----
QUICK.forEach(min=>{
  const b=document.createElement('button');
  b.className='chip'; b.textContent=min+' Min'; b.dataset.min=min;
  b.onclick=()=>{
    selectedTime=min; customEl.value='';
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    b.classList.add('active'); updateProgress();
  };
  chipsEl.appendChild(b);
});
customEl.addEventListener('input',()=>{
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  const v=parseInt(customEl.value,10);
  selectedTime=(v>0)?v:null; updateProgress();
});

// ---- art selection ----
document.querySelectorAll('.art').forEach(el=>{
  el.onclick=()=>selectArt(el.dataset.art);
});
function selectArt(art){
  currentArt=art; selectedTime=null; lastPick=null; customEl.value='';
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  document.getElementById('result').classList.remove('show');
  document.getElementById('err').textContent='';

  const m=ART_META[art];
  pill.className='pill '+m.cls;
  pill.textContent=m.icon+' '+art;

  // Meditation: keine Zeiten -> Zeitauswahl ausblenden
  const noTime = (art==="Meditation");
  timeBlock.style.display = noTime ? 'none' : 'block';
  medNote.style.display = noTime ? 'block' : 'none';

  subtitle.textContent = noTime ? 'Tippe auf Video auswählen' : 'Wie viel Zeit hast du?';
  screenArt.classList.remove('active');
  screenTime.classList.add('active');
  updateProgress();
}

  screenTime.classList.remove('active');
  screenArt.classList.add('active');
  subtitle.textContent='Wähle eine Kategorie';
};

// ---- selection core ----
function eligible(art,time){
  return VIDEOS.filter(v=>{
    if(v.art!==art) return false;
    if(v.d==null) return true;          // ohne Dauer -> immer passend
    if(time==null) return true;
    return v.d<=time;
  });
}

function pick(){
  document.getElementById('err').textContent='';
  const needTime = (currentArt!=="Meditation");
  if(needTime && (!selectedTime || selectedTime<1)){
    document.getElementById('err').textContent='Bitte zuerst eine Zeit wählen.';
    return;
  }
  const pool = eligible(currentArt, needTime?selectedTime:null);
  if(pool.length===0){
    document.getElementById('err').textContent='Kein Video passt in '+selectedTime+' Min (kürzestes ist 10 Min).';
    return;
  }
  let watched = getWatched(currentArt);
  let unseen = pool.filter(v=>!watched.includes(v.id));

  if(unseen.length===0){
    watched = watched.filter(id => !pool.some(v=>v.id===id));
    unseen = pool.slice();
    toast('Alle Videos dieser Auswahl gesehen – neue Runde! 🌱');
  }

  let choices = unseen;
  if(unseen.length>1 && lastPick){
    const f = unseen.filter(v=>v.id!==lastPick);
    if(f.length) choices=f;
  }

  const chosen = choices[Math.floor(Math.random()*choices.length)];
  lastPick = chosen.id;
  watched.push(chosen.id);
  setWatched(currentArt, watched);

  showResult(chosen);
  updateProgress();

  const url='https://youtu.be/'+chosen.id;
  document.getElementById('rOpen').href=url;
  window.open(url,'_blank');
}

function showResult(v){
  document.getElementById('rDur').textContent = (v.d==null? 'Meditation' : v.d+' Min');
  document.getElementById('rChan').textContent = v.c;
  document.getElementById('rTitle').textContent = v.t;
  document.getElementById('rOpen').href='https://youtu.be/'+v.id;
  document.getElementById('result').classList.add('show');
}

function updateProgress(){
  const p=document.getElementById('progress');
  if(!currentArt){ p.innerHTML=''; return; }
  const needTime = (currentArt!=="Meditation");
  if(needTime && !selectedTime){
    const total=VIDEOS.filter(v=>v.art===currentArt).length;
    p.innerHTML=total+' '+currentArt+'-Videos in deiner Sammlung.'; return;
  }
  const pool=eligible(currentArt, needTime?selectedTime:null);
  if(pool.length===0){ p.innerHTML=''; return; }
  const watched=getWatched(currentArt);
  const seen=pool.filter(v=>watched.includes(v.id)).length;
  const scope = needTime ? ('für ≤ '+selectedTime+' Min') : ('('+currentArt+')');
  p.innerHTML=scope+': <b>'+seen+' von '+pool.length+'</b> gesehen.<br>Wiederholung erst, wenn alle durch sind.';
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2600);
}

document.getElementById('goBtn').onclick=pick;
document.getElementById('againBtn').onclick=pick;
document.getElementById('resetBtn').onclick=()=>{
  setWatched(currentArt,[]); lastPick=null;
  document.getElementById('result').classList.remove('show');
  updateProgress();
  toast('Verlauf zurückgesetzt.');
};
</script>
</body>
